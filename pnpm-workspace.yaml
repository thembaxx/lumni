# minimumReleaseAge: 1440
# trustPolicy: no-downgrade
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
overrides:
  protobufjs: 7.6.3
  effect: '>=3.20.0'
  postcss: 8.5.15
  tmp: '^0.2.6'
minimumReleaseAgeExclude:
  - '@next/bundle-analyzer@16.2.9'
  - '@next/env@16.2.9'
  - '@next/eslint-plugin-next@16.2.9'
  - '@next/swc-darwin-arm64@16.2.9'
  - '@next/swc-darwin-x64@16.2.9'
  - '@next/swc-linux-arm64-gnu@16.2.9'
  - '@next/swc-linux-arm64-musl@16.2.9'
  - '@next/swc-linux-x64-gnu@16.2.9'
  - '@next/swc-linux-x64-musl@16.2.9'
  - '@next/swc-win32-arm64-msvc@16.2.9'
  - '@next/swc-win32-x64-msvc@16.2.9'
  - '@storybook/builder-webpack5@10.4.3'
  - '@storybook/core-webpack@10.4.3'
  - '@storybook/nextjs@10.4.3'
  - '@storybook/preset-react-webpack@10.4.3'
  - '@storybook/react-dom-shim@10.4.3'
  - '@storybook/react@10.4.3'
  - eslint-config-next@16.2.9
  - next@16.2.9
  - oxlint-plugin-react-doctor@0.5.1
  - react-doctor@0.5.1
  - react-konva@19.2.5
  - storybook@10.4.3
  - storybook@10.4.6
  - knip@6.17.2
  - smol-toml@1.7.0
  - protobufjs@7.6.3
