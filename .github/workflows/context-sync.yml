name: Daily Context Sync
on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM daily
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Context
        run: |
          echo "Context sync placeholder - run manual prompt to update files"
      - name: Commit Changes
        run: |
          git config user.name "Context Bot"
          git config user.email "bot@example.com"
          git add .context/
          git diff --cached --quiet || git commit -m "chore: daily context sync $(date +%Y-%m-%d)"
          git push
